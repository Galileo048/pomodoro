[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "formula2manim"
version = "0.1.0"
description = "Generate Manim animations from physics/math formulas with DeepSeek AI assistance"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "manim>=0.18",
    "openai>=1.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
f2m = "formula2manim.cli:main"
f2m-gui = "formula2manim.gui:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
